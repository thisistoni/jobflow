[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobflow-local"
version = "0.1.0"
description = "Single-user local job-search review loop."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "PyYAML==6.0.2",
    "cryptography==45.0.6",
    "reportlab==4.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
]

[project.scripts]
jobflow = "jobflow.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
